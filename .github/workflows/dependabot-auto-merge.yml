# Tier A — GitHub-native auto-merge for safe Dependabot updates.
#
# Canonical copy (ADR-0021). Vendor this file to a repo as
# .github/workflows/dependabot-auto-merge.yml. When a Dependabot PR is a semver
# minor or patch, it enables auto-merge; GitHub then squash-merges it only once
# the branch-protection required checks pass. Majors are left untouched for the
# Tier B prepare-and-flag resolver / owner review.
#
# Merge token: auto-merge is enabled with a token from the org's
# jamarq-automerge GitHub App, not GITHUB_TOKEN. GitHub starts no workflow for
# a push made with GITHUB_TOKEN, so a squash merge enabled with it landed on main
# with no main CI run. A merge enabled by the App is attributed to the App, and
# its push runs the repo's push workflows like any other. The App's client ID
# and private key are org-level Dependabot secrets (a run triggered by
# Dependabot cannot read Actions secrets): AUTOMERGE_APP_ID and
# AUTOMERGE_APP_PRIVATE_KEY. Without them the job falls back to GITHUB_TOKEN and
# warns, so the merge still happens. See docs/dependabot-automation.md.
#
# Repo prerequisites (set during rollout):
#   - Settings: "Allow auto-merge" on (and "Automatically delete head branches").
#   - Branch protection on the default branch with >=1 required status check
#     (the repo's own CI job), no required review, enforce_admins:false.
#
# Runs on the org's jamarq-win pool, which is free where hosted minutes are
# not. A PUBLIC repository must change runs-on to ubuntu-latest: the pool's
# runner group refuses public repositories, and a fork PR must never reach the
# runner VM (docs/runner-fleet-windows-migration.md, "Do Not").
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.actor == 'dependabot[bot]' }}
    env:
      HAS_MERGE_APP: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mint the merge token
        id: app-token
        if: >-
          env.HAS_MERGE_APP == 'true' && (
          steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch')
        uses: actions/create-github-app-token@v3
        with:
          # app-id, not client-id: actionlint 1.7.12 (the fleet's pin) knows only
          # app-id and fails the newer input. Switch when the pin moves.
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}

      - name: Enable auto-merge for minor/patch
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: |
          if [ "$HAS_MERGE_APP" != "true" ]; then
            echo "::warning title=No merge App token::AUTOMERGE_APP_PRIVATE_KEY is not set as a Dependabot secret, so this merge will start no CI run on main."
          fi
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
