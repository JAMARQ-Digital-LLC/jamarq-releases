name: Check

on:
  push:
    branches: [main]
  pull_request:
    # The defaults plus ready_for_review, so marking a draft ready runs the
    # jobs the draft skipped (docs/github-actions-maintenance.md, agentic-instructions).
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# Docs-only pull requests skip `test` (the fleet pattern in agentic-instructions,
# docs/github-actions-maintenance.md, "Docs-only pull requests"). The workflow
# always triggers, so the required `test` check reports on every PR: skipped by
# its `if` counts as passing, and a failed `changes` job makes it run and fail.
# A newer push to the same pull request cancels its older run. A run on
# main, a release or a schedule is never cancelled once it starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changes and secret scan
    # Not a required check. Public repository: hosted runners only.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # actions: read lets a push find the last commit this workflow passed on.
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The classification and Gitleaks both read a commit range.
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          everything() {
            echo "$1: running everything."
            echo "code=true" >> "${GITHUB_OUTPUT}"
            exit 0
          }

          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              base="$(git merge-base "${PR_BASE_SHA}" "${PR_HEAD_SHA}")"
              head="${PR_HEAD_SHA}"
              ;;
            push)
              # A push is docs-only when nothing but documentation changed
              # since the last commit this workflow passed on, on this branch.
              # Not github.event.before: a newer push cancels a pending run, so
              # the commit before this one may never have been tested. A pass
              # that skipped the heavy jobs counts, because it could only skip
              # them when everything since the pass before it was docs.
              workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .workflow_id)" \
                || everything "Could not read this run"
              base="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?branch=${GITHUB_REF_NAME}&event=push&status=success&per_page=1" \
                --jq '.workflow_runs[0].head_sha // empty')" \
                || everything "Could not read the last passing run"
              [[ -n "${base}" ]] || everything "No passing run on ${GITHUB_REF_NAME} yet"
              git merge-base --is-ancestor "${base}" "${GITHUB_SHA}" \
                || everything "The last passing commit ${base} is not behind this one"
              echo "Comparing with the last passing commit ${base}."
              head="${GITHUB_SHA}"
              ;;
            *)
              everything "Event ${GITHUB_EVENT_NAME}"
              ;;
          esac

          # Documentation is Markdown at the root or under docs/, and the
          # licence. Nothing in publish/ or the workflows reads them.
          is_docs() {
            case "$1" in
              .github/*) return 1 ;;
              docs/*.md) return 0 ;;
              */*) return 1 ;;
              *.md|LICENSE|LICENSE.*) return 0 ;;
              *) return 1 ;;
            esac
          }

          # --no-renames lists both sides of a rename.
          files="$(git diff --name-only --no-renames "${base}" "${head}")"

          code=false
          count=0
          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue
            count=$((count + 1))
            if is_docs "${file}"; then
              echo "docs  ${file}"
            else
              echo "code  ${file}"
              code=true
            fi
          done <<< "${files}"

          if [[ "${count}" -eq 0 ]]; then
            echo "No changed files found: running everything."
            code=true
          fi

          echo "code=${code}" >> "${GITHUB_OUTPUT}"
          if [[ "${code}" == "true" ]]; then
            echo "Code changed: every job runs."
          else
            echo "Docs only: test is skipped."
          fi

      # Pinned and checksum-verified, as in the app repositories.
      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          # Copy a pinned file from the runner's release cache when it has one, else
          # download it, giving up on a transfer under 100 KB/s for 20 s or past 2 min. The sha256 check below still applies.
          fetch_release() {
            local cached="/opt/jamarq-tools/releases/${1#https://}"
            if [ -f "${cached}" ]; then cp "${cached}" "$2"; return; fi
            curl -sSfL --connect-timeout 15 --max-time 120 --speed-limit 102400 --speed-time 20 --retry 2 --retry-all-errors --retry-delay 3 "$1" -o "$2"
          }
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          expected_sha="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          bin="${RUNNER_TEMP}/gitleaks-bin"
          mkdir -p "${bin}"
          fetch_release "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" "${RUNNER_TEMP}/${archive}"
          echo "${expected_sha}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${bin}" gitleaks
          echo "${bin}" >> "${GITHUB_PATH}"

      - name: Scan changed commits
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          zero="0000000000000000000000000000000000000000"
          case "${GITHUB_EVENT_NAME}" in
            pull_request) base="${PR_BASE_SHA}" ;;
            push) base="${PUSH_BEFORE}" ;;
            *) base="" ;;
          esac
          if [[ -n "${base}" && "${base}" != "${zero}" ]]; then
            range="${base}..${GITHUB_SHA}"
          else
            range="${GITHUB_SHA}^..${GITHUB_SHA}"
          fi
          echo "Scanning commits: ${range}"
          gitleaks git --log-opts="${range}" --redact=100 --exit-code=1 --no-banner --no-color

  test:
    # Required check: keep the job id `test`.
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || (github.event.pull_request.draft != true && needs.changes.outputs.code != 'false')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stop if the changes job failed
        if: ${{ needs.changes.result != 'success' }}
        run: |
          echo "::error::The changes job (classification and secret scan) did not succeed: ${{ needs.changes.result }}. Fix or rerun it."
          exit 1

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node --test publish/feed.test.mjs
      - run: node --check publish/publish.mjs

      # Pinned and checksum-verified, as in the app repositories.
      - name: Lint workflows
        shell: bash
        run: |
          set -euo pipefail
          # Copy a pinned file from the runner's release cache when it has one, else
          # download it, giving up on a transfer under 100 KB/s for 20 s or past 2 min. The sha256 check below still applies.
          fetch_release() {
            local cached="/opt/jamarq-tools/releases/${1#https://}"
            if [ -f "${cached}" ]; then cp "${cached}" "$2"; return; fi
            curl -sSfL --connect-timeout 15 --max-time 120 --speed-limit 102400 --speed-time 20 --retry 2 --retry-all-errors --retry-delay 3 "$1" -o "$2"
          }
          version="1.7.12"
          sha="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          fetch_release "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" "${RUNNER_TEMP}/actionlint.tar.gz"
          echo "${sha}  ${RUNNER_TEMP}/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/actionlint.tar.gz" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint"
